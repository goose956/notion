[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["corepack enable && corepack prepare pnpm@10.0.0 --activate && pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter web build"]

[start]
cmd = "pnpm --filter @niche-factory/db migrate ; pnpm --filter @niche-factory/db seed ; pnpm --filter web start"
